name: Build article PDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    name: Compile LaTeX article
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.ref }}

      - name: Cache TeX Live package archives
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: texlive-apt-ubuntu-24.04-v1
          restore-keys: |
            texlive-apt-ubuntu-24.04-

      - name: Install LaTeX and Cyrillic support
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            fonts-dejavu-core \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-lang-cyrillic

      - name: Compile PDF
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error main.tex
          mv main.pdf LogicMUS-Eval-Article.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: LogicMUS-Eval-Article
          path: LogicMUS-Eval-Article.pdf
          if-no-files-found: error
          retention-days: 30

      - name: Commit PDF to pull request branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f LogicMUS-Eval-Article.pdf
          if git diff --cached --quiet; then
            echo "LogicMUS-Eval-Article.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled article PDF"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Commit PDF to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f LogicMUS-Eval-Article.pdf
          if git diff --cached --quiet; then
            echo "LogicMUS-Eval-Article.pdf is unchanged."
            exit 0
          fi
          git commit -m "docs: update compiled article PDF"
          git push
